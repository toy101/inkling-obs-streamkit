name: admin-smoke

on:
  pull_request:

concurrency:
  group: admin-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: apps/admin
        run: bun run playwright install --with-deps chromium

      - name: Run admin browser tests
        run: bun run --filter admin test:e2e

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: admin-smoke-artifacts
          path: apps/admin/test-results/
          if-no-files-found: ignore
          retention-days: 7
