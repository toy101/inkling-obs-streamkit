name: quality

on:
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare deterministic fixtures
        run: bun run scripts/prepare-ci-fixtures.ts

      - name: Check API types
        run: bunx tsc --noEmit -p apps/api/tsconfig.json

      - name: Lint web
        run: bun run --filter web lint

      - name: Build web
        run: bun run --filter web build

      - name: Spellcheck
        run: bun run spellcheck
